name: Build VoiceBox ROCm for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rocm-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install --no-deps omnivoice

      - name: Build ROCm server binary
        shell: bash
        working-directory: backend
        run: python build_binary.py --rocm

      - name: Package ROCm server and libraries
        shell: bash
        run: |
          python scripts/package_rocm.py \
            backend/dist/voicebox-server-rocm/ \
            --output release-assets/ \
            --platform windows-x86_64 \
            --rocm-libs-version rocm7.2-v1 \
            --torch-compat ">=2.9.0,<2.10.0"

      - name: Upload ROCm server
        uses: actions/upload-artifact@v4
        with:
         name: voicebox-server-rocm-windows
         path: |
          release-assets/voicebox-server-rocm-windows-x86_64.tar.gz
          release-assets/voicebox-server-rocm-windows-x86_64.tar.gz.sha256
         if-no-files-found: error
         retention-days: 7

      - name: List packaged assets
        shell: pwsh
        run: |
          Get-ChildItem -Force release-assets | Format-Table Name, Length
          Write-Host "Archive exists:"
          Test-Path release-assets/rocm-libs-rocm7.2-v1.tar.gz
          Write-Host "Checksum exists:"
          Test-Path release-assets/rocm-libs-rocm7.2-v1.tar.gz.sha256

      - name: Upload ROCm libraries
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-rocm-libraries
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
